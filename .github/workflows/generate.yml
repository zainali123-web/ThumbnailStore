name: Generate and Upload Product

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SELLAPP_API_KEY: ${{ secrets.SELLAPP_API_KEY }}
          SELLAPP_STORE_ID: ${{ secrets.SELLAPP_STORE_ID }}
        run: |
          python main.py
